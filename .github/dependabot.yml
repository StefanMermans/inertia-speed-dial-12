version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      vite-major:
        patterns:
          - vite
          - '@vitejs/*'
          - laravel-vite-plugin
        update-types:
          - major
      eslint-major:
        patterns:
          - eslint
          - '@eslint/*'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
          - typescript-eslint
        update-types:
          - major
      react-major:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - major
      inertia-major:
        patterns:
          - '@inertiajs/*'
        update-types:
          - major
      tailwind-major:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
        update-types:
          - major
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: postgres
        update-types:
          - 'version-update:semver-major'
