[supervisord]
nodaemon=true

[program:php-fpm]
command=/usr/local/sbin/php-fpm

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"

[program:ssr]
directory=/var/www
command=php artisan inertia:start-ssr
autostart=true
autorestart=true
stdout_logfile=/var/log/ssr.log
stderr_logfile=/var/log/ssr.err.log

[program:queue]
directory=/var/www
command=php artisan queue:work --tries=3 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/log/queue.log
stderr_logfile=/var/log/queue.err.log

[program:scheduler]
directory=/var/www
command=php artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/var/log/scheduler.log
stderr_logfile=/var/log/scheduler.err.log
